# Keeps the backend awake and guarantees the daily crawl.
#
# The backend runs on a free Hugging Face Space, which pauses after 48 hours
# without a request. The crawler is an in-process scheduler, so a paused Space
# means no crawl. Two jobs cover that:
#
#   ping   every 15 minutes: GET /health so the Space never goes idle.
#   crawl  once a day: POST /agents/run-cycle so the crawl happens even if the
#          Space did pause and the in-process scheduler was lost with it.
#
# Setup (once): add the Space's CRON_TOKEN as a repository secret named
# CRON_TOKEN (Settings -> Secrets and variables -> Actions). The ping job needs
# nothing. Scheduled workflows only run on the default branch.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity; any commit re-enables them. A free uptime monitor (UptimeRobot,
# cron-job.org) hitting /health is a good second line of defence.

name: Keep backend awake and run daily crawl

on:
  schedule:
    - cron: "*/15 * * * *"    # ping
    - cron: "30 2 * * *"      # crawl at 02:30 UTC = 08:00 IST
  workflow_dispatch:
    inputs:
      run_crawl:
        description: "Also trigger a crawl now"
        type: boolean
        default: false

env:
  BASE_URL: https://abhishek-elets-ias-transfer-intelligence.hf.space

jobs:
  ping:
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health (retries while the Space wakes up)
        run: |
          curl --silent --show-error --fail \
               --max-time 60 --retry 5 --retry-delay 20 --retry-all-errors \
               "$BASE_URL/health" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("status:", d["status"], "| next crawl:", d["scheduler"]["next_run"])'

  crawl:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.run_crawl)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the secret is configured
        run: |
          if [ -z "${{ secrets.CRON_TOKEN }}" ]; then
            echo "::error::Repository secret CRON_TOKEN is not set. Copy the Space's CRON_TOKEN into Settings -> Secrets -> Actions."
            exit 1
          fi
      - name: POST /api/v1/agents/run-cycle
        run: |
          body=$(curl --silent --show-error --fail \
                      --max-time 60 --retry 5 --retry-delay 20 --retry-all-errors \
                      -X POST "$BASE_URL/api/v1/agents/run-cycle" \
                      -H "x-cron-token: ${{ secrets.CRON_TOKEN }}")
          echo "$body"
          echo "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("started") or d.get("already_running") else 1)'
