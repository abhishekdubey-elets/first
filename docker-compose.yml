# Docker Compose for the IAS Transfer Intelligence Dashboard.
#
# Minimal stack: Postgres, the FastAPI API, and the Next.js dashboard.
# The LLM is OpenAI (cloud) — set OPENAI_API_KEY in .env. There is NO Redis and
# NO Celery: the discovery cycle runs as a FastAPI background task, triggered by
# a cron pinging POST /api/v1/agents/run-cycle (set CRON_TOKEN).
#
# Quick start:
#   1. cp .env.example .env   # set SECRET_KEY, ENCRYPTION_KEY, OPENAI_API_KEY, CRON_TOKEN
#   2. docker compose up -d --build
#   3. (optional) curl an immediate cycle:
#        curl -X POST localhost:8000/api/v1/agents/run-cycle -H "x-cron-token: <CRON_TOKEN>"
#
# URLs once up:
#   API docs    -> http://localhost:8000/docs
#   Dashboard   -> http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ias
      POSTGRES_PASSWORD: ias_password
      POSTGRES_DB: ias_transfers
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ias -d ias_transfers"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Bootstrap the DB schema on first boot.
      RUN_DB_INIT: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - secrets:/data/secrets
      - storage:/data/storage
    # Uses the image default CMD (uvicorn app.main:app --host 0.0.0.0 --port 8000).

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  # Shared so the API sees the uploaded Google service-account JSON.
  secrets:
  storage:
