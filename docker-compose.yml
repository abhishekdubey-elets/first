# Docker Compose for the IAS Transfer Intelligence Dashboard.
#
# One-command local stack: Postgres, the FastAPI API (which runs the discovery
# pipeline in-process on an hourly APScheduler job — no separate worker or
# broker), and the Next.js dashboard. The LLM is OpenAI (set OPENAI_API_KEY in .env).
#
# Quick start:
#   1. cp .env.example .env   # then set SECRET_KEY, ENCRYPTION_KEY, OPENAI_API_KEY
#   2. docker compose up -d --build
#
# URLs once up:
#   API docs    -> http://localhost:8000/docs
#   Health      -> http://localhost:8000/health
#   Dashboard   -> http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ias
      POSTGRES_PASSWORD: ias_password
      POSTGRES_DB: ias_transfers
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ias -d ias_transfers"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # The image listens on $PORT (default 7860 for Hugging Face); use 8000 locally.
      PORT: "8000"
      # Ensure the DB schema on boot (python -m scripts.init_db).
      RUN_DB_INIT: "1"
      # Point at the compose Postgres regardless of what .env says.
      DATABASE_URL: postgresql+asyncpg://ias:ias_password@db:5432/ias_transfers
      DATABASE_URL_SYNC: postgresql+psycopg2://ias:ias_password@db:5432/ias_transfers
      DB_SSL: "false"
      # Persist uploaded Google credentials / runtime settings and fetched files.
      GOOGLE_CREDENTIALS_FILE: /app/data/secrets/google-credentials.json
      STORAGE_DIR: /app/data/storage
      BACKEND_CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - secrets:/app/data/secrets
      - storage:/app/data/storage

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Next.js inlines NEXT_PUBLIC_* at build time; the app's built-in default
      # is already http://localhost:8000, so this only documents the intent.
      # For any other backend URL, rebuild the image with the variable set.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  # Google service-account JSON + app_settings.json written by the Settings page.
  secrets:
  storage:
