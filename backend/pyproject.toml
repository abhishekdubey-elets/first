[project]
name = "ias-transfer-backend"
version = "0.1.0"
description = "Multi-agent backend for the IAS Transfer Intelligence Dashboard"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
